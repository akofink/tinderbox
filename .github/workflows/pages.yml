name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Install trunk
        run: |
          curl -fsSL -o trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf trunk.tar.gz
          ./trunk --version
      - name: Build web
        working-directory: crates/app
        run: |
          # Path prefix, not the github.io host. The user site redirects that host to
          # akofink.com, and Chrome blocks the redirected module script.
          public_url="/${{ github.event.repository.name }}/"
          "$GITHUB_WORKSPACE/trunk" build --release --public-url "$public_url"
      - name: Upload pull request build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tinderbox-web
          path: crates/app/dist
          if-no-files-found: error
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/app/dist

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
