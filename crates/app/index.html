<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tinderbox</title>
  <base data-trunk-public-url />
  <link data-trunk rel="rust" data-wasm-opt="2" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #121624;
      color: #e8e8e8;
      font-family: sans-serif;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <canvas id="the_canvas_id"></canvas>
  <div class="loading" id="loading_text">Loading Tinderbox…</div>
</body>
</html>
