[package]
name = "tinderbox-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tinderbox-sim = { path = "../sim" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu"] }
web-time = "1"

# Linux window backends stay native-only. Enabling them on wasm fails the browser build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Direct wgpu features unify with eframe and compile the WebGL2 fallback next to WebGPU.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "Event",
    "File",
    "FileList",
    "FileReader",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "Storage",
    "Url",
    "Window",
] }
wgpu = { version = "24", default-features = false, features = ["webgpu", "webgl"] }

[lints]
workspace = true
