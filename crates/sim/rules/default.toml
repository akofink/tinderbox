heat_transfer = 0.08
evaporation_rate = 0.08
condensation_humidity = 78.0
pressure_wind = 0.15

# Wind strengthens fire spread only when the target is directly downwind.
[[interactions]]
when = "fire"
with = "tree"
result = "fire"
chance = 0.16
downwind_bonus = 0.42

[[interactions]]
when = "fire"
with = "plant"
result = "fire"
chance = 0.12
downwind_bonus = 0.5

