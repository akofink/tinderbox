# Dry organic matter piles into humus with ash and remains easy to ignite.
[[interactions]]
when = "deadwood"
with = "ash"
result = "humus"
self_result = "humus"
chance = 0.22

[[interactions]]
when = "ash"
with = "deadwood"
result = "humus"
self_result = "humus"
chance = 0.22

