# Contact with water hydrates soil; ash enriches it into faster-sprouting soil.
# Seeds can also establish directly on a cool ash bed after fire, even in dry weather.
[[interactions]]
when = "soil"
with = "water"
result = "wet_soil"
self_result = "wet_soil"
chance = 0.08

[[interactions]]
when = "water"
with = "soil"
result = "wet_soil"
self_result = "wet_soil"
chance = 0.08

